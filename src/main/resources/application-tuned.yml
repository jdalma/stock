spring:
  application:
    name: stock-test

  # ===========================================
  # DataSource 설정 (로컬 Docker MySQL)
  # ===========================================
  datasource:
    url: jdbc:mysql://localhost:3306/stockdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&useUnicode=true
    username: testuser
    password: testpassword
    driver-class-name: com.mysql.cj.jdbc.Driver

    # ===========================================
    # HikariCP 설정 - 모두 기본값 사용
    # ===========================================
    # 아래는 HikariCP 기본값 참고용 주석입니다 (설정하지 않으면 자동 적용)
    #
    # [Pool Size]
    # maximum-pool-size: 10        # 최대 커넥션 수
    # minimum-idle: 10             # 최소 유휴 커넥션 (기본값 = maximum-pool-size)
    #
    # [Timeout]
    # connection-timeout: 30000    # 커넥션 획득 대기 시간 (30초)
    # idle-timeout: 600000         # 유휴 커넥션 제거 시간 (10분)
    # max-lifetime: 1800000        # 커넥션 최대 수명 (30분)
    # validation-timeout: 5000     # 커넥션 유효성 검사 타임아웃 (5초)
    #
    # [모니터링]
    # leak-detection-threshold: 0  # 커넥션 누수 감지 (0 = 비활성)
    # register-mbeans: false       # JMX MBeans 등록
    #
    hikari:
      pool-name: StockHikariPool
      maximum-pool-size: 5            # 병목 시뮬레이션용 (기본값: 10)
      leak-detection-threshold: 2000  # 커넥션 누수 감지 (2초)
      register-mbeans: true           # JMX MBeans 등록
  # ===========================================
  # JPA 설정
  # ===========================================
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    show-sql: false

# ===========================================
# Tomcat 설정 (스레드풀 메트릭 활성화)
# ===========================================
server:
  tomcat:
    mbeanregistry:
      enabled: true         # Tomcat MBean 등록 (스레드 메트릭 노출에 필요)

# ===========================================
# Actuator 설정 (모니터링)
# ===========================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
        hikaricp.connections.acquire: true
      percentiles:
        http.server.requests: 0.5, 0.95, 0.99
        hikaricp.connections.acquire: 0.5, 0.95, 0.99

# ===========================================
# 로깅 설정
# ===========================================
logging:
  level:
    com.zaxxer.hikari: INFO
    com.zaxxer.hikari.HikariConfig: DEBUG
    org.test.stock: DEBUG
