spring:
  application:
    name: stock-test

  # ===========================================
  # DataSource 설정 (로컬 Docker MySQL)
  # ===========================================
  datasource:
    url: jdbc:mysql://localhost:3306/stockdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
    username: testuser
    password: testpassword
    driver-class-name: com.mysql.cj.jdbc.Driver

    # ===========================================
    # HikariCP 튜닝 설정
    # Phase 2: 성능 최적화 테스트용
    # ===========================================
    hikari:
      pool-name: StockHikariPool

      # =========================================
      # Pool Size 튜닝
      # =========================================
      # 권장 공식: (core_count * 2) + effective_spindle_count
      # 하지만 동시 요청 수에 따라 조정 필요
      #
      # 기본값: 10 -> 튜닝값: 30
      # 이유: 동시 요청 증가에 대응, DB max_connections(200) 내에서 여유
      maximum-pool-size: 30

      # 유휴 커넥션 유지 (기본값: maximum-pool-size와 동일)
      # 트래픽 변동에 대비하여 50% 유지
      minimum-idle: 15

      # =========================================
      # 타임아웃 튜닝
      # =========================================
      # 커넥션 획득 대기 시간 (기본값: 30초 -> 튜닝값: 10초)
      # 이유: 빠른 실패 전략 - 문제 조기 감지
      connection-timeout: 10000

      # 유휴 커넥션 제거 시간 (기본값: 10분 -> 튜닝값: 5분)
      # 이유: 불필요한 리소스 점유 방지
      idle-timeout: 300000

      # 커넥션 최대 수명 (기본값: 30분 -> 튜닝값: 15분)
      # 이유: MySQL wait_timeout(기본 8시간)보다 짧게 설정
      # DB 레벨 타임아웃으로 인한 끊김 방지
      max-lifetime: 900000

      # =========================================
      # 검증 설정
      # =========================================
      validation-timeout: 5000

      # 커넥션 누수 감지 활성화 (기본값: 0 -> 튜닝값: 60초)
      # 이유: 60초 이상 반환되지 않는 커넥션 로깅
      leak-detection-threshold: 60000

      # 메트릭 활성화
      register-mbeans: true

      # =========================================
      # 추가 최적화 설정
      # =========================================
      # 커넥션 테스트 쿼리 (MySQL 8.0+에서는 자동 처리)
      # connection-test-query: SELECT 1

      # PreparedStatement 캐시 (JDBC 드라이버 레벨)
      data-source-properties:
        cachePrepStmts: true
        prepStmtCacheSize: 250
        prepStmtCacheSqlLimit: 2048
        useServerPrepStmts: true

  # ===========================================
  # JPA 설정
  # ===========================================
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        # 배치 처리 최적화
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true
    show-sql: false

# ===========================================
# Actuator 설정 (모니터링)
# ===========================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
        hikaricp.connections.acquire: true
      percentiles:
        http.server.requests: 0.5, 0.95, 0.99
        hikaricp.connections.acquire: 0.5, 0.95, 0.99

# ===========================================
# 로깅 설정
# ===========================================
logging:
  level:
    com.zaxxer.hikari: INFO
    com.zaxxer.hikari.HikariConfig: DEBUG
    org.test.stock: DEBUG
