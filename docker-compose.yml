services:
  # ===========================================
  # MySQL 데이터베이스
  # ===========================================
  mysql:
    image: mysql:8.0
    container_name: stress-test-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: stockdb
      MYSQL_USER: testuser
      MYSQL_PASSWORD: testpassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql-init:/docker-entrypoint-initdb.d
    command: >
      --max_connections=200
      --innodb_buffer_pool_size=256M
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --init-connect='SET NAMES utf8mb4'
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - stress-test-network

  # ===========================================
  # Prometheus (Spring Actuator 메트릭 수집)
  # ===========================================
  prometheus:
    image: prom/prometheus:latest
    container_name: stress-test-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
      - '--web.enable-lifecycle'
      - '--web.enable-remote-write-receiver'
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - stress-test-network

  # ===========================================
  # MySQL Exporter (MySQL 메트릭 수집)
  # ===========================================
  mysql-exporter:
    image: prom/mysqld-exporter:latest
    container_name: stress-test-mysql-exporter
    ports:
      - "9104:9104"
    environment:
      MYSQLD_EXPORTER_PASSWORD: rootpassword
    command:
      - --mysqld.username=root
      - --mysqld.address=mysql:3306
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - stress-test-network

  # ===========================================
  # Loki (로그 수집)
  # ===========================================
  loki:
    image: grafana/loki:2.9.0
    container_name: stress-test-loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - stress-test-network

  # ===========================================
  # Grafana (대시보드)
  # ===========================================
  grafana:
    image: grafana/grafana:latest
    container_name: stress-test-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Image Renderer 설정
      GF_RENDERING_SERVER_URL: http://renderer:8081/render
      GF_RENDERING_CALLBACK_URL: http://grafana:3000/
      GF_LOG_FILTERS: rendering:debug
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
      - loki
    networks:
      - stress-test-network

networks:
  stress-test-network:
    driver: bridge

volumes:
  mysql_data:
  grafana_data:
  prometheus_data:
